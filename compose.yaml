# Local integration stack. Production needs HTTPS and authenticated MongoDB.
services:
  mongo:
    image: mongo:8.2
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { if (rs.status().myState !== 1) quit(1) } catch (e) { rs.initiate({_id: ''rs0'', members: [{_id: 0, host: ''mongo:27017''}]}); quit(1) }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ['127.0.0.1:4000:4000']
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/opsflow?replicaSet=rs0
      APP_ORIGIN: http://127.0.0.1:4000
      SERVE_WEB: 'true'
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
